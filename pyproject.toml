[tool.poetry]
name = "erg-ns1"
version = "0.1.0"
description = "ErG + GED + algoritmo hungaro para priorizar inhibidores de NS1"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
rdkit = ">=2024.3.1"
numpy = ">=1.26"
scipy = ">=1.11"
scikit-learn = ">=1.3"
pandas = ">=2.0"
networkx = ">=3.0"
matplotlib = ">=3.7"
openpyxl = ">=3.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
